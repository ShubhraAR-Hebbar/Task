version: '3.8'

services:
  # Persistent Redis Store with AOF and RDB configured for durable state recovery
  redis:
    image: redis:7.2-alpine
    container_name: pricing_engine_redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Real-Time Pricing Engine Application
  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricing_engine_core
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - EXTERNAL_WS_URL=${EXTERNAL_WS_URL:-wss://v3-prod.livefxhub.com/ws/algo}
      - API_KEY=${API_KEY:-}
      - API_SECRET=${API_SECRET:-${SECRET_KEY:-}}
      - SECRET_KEY=${SECRET_KEY:-${API_SECRET:-}}
      - SUBSCRIBE_SYMBOLS=${SUBSCRIBE_SYMBOLS:-EURUSD,GBPUSD,USDJPY,BTCUSD,ETHUSD}
      - OUTBOUND_WS_HOST=0.0.0.0
      - OUTBOUND_WS_PORT=8765
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - REDIS_RETENTION_SECONDS=90000
      - WINDOW_SECONDS=86400
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_REPORT_INTERVAL_SECONDS=10.0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.create_connection(('127.0.0.1', 8765), timeout=2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
    driver: local
